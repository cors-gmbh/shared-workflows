name: "🧪 Guardrails CI"

# Unit tests for the guardrail rule modules (node:test, no dependencies).

on:
  pull_request:
    paths:
      - "scripts/guardrails/**"
      - ".github/workflows/guardrails-ci.yml"
  push:
    branches: [main]
    paths:
      - "scripts/guardrails/**"
      - ".github/workflows/guardrails-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "🧪 Run tests"
        run: node --test scripts/guardrails/*.test.mjs
