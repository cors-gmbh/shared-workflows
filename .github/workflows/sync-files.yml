name: "🔄 Sync files to org repos"

# Distributes the guardrail caller workflows and the PR template into all
# project/bundle repos listed in .github/sync.yml. The sync action opens a PR
# in every target repo whose files differ (branch prefix: repo-sync/...).
#
# Auth: repo-file-sync-action explicitly does NOT work with GITHUB_TOKEN.
# Since v1.21 it accepts a GitHub App installation token via
# GH_INSTALLATION_TOKEN (GIT_USERNAME/GIT_EMAIL become mandatory then), so we
# use the CORS CD bot instead of a machine-user PAT. Details:
# docs/GUARDRAILS.md.

on:
  push:
    branches: [main]
    paths:
      - "templates/**"
      - ".github/sync.yml"
      - ".github/workflows/sync-files.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sync-files
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "🔑 Create app token"
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # No `repositories` filter: the token must reach every target repo
          # listed in .github/sync.yml.
          owner: ${{ github.repository_owner }}

      - name: "📥 Checkout"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: "🔄 Run file sync"
        uses: BetaHuhn/repo-file-sync-action@8b92be3375cf1d1b0cd579af488a9255572e4619 # v1.21.1
        with:
          GH_INSTALLATION_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_USERNAME: "${{ steps.app-token.outputs.app-slug }}[bot]"
          GIT_EMAIL: "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          COMMIT_PREFIX: "🔄 sync:"
          PR_LABELS: |
            file-sync
