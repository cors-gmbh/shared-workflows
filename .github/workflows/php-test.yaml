name: "⚙️ PHP Test"

on:
  workflow_call:
    inputs:
      php-version:
        description: "PHP version (e.g. 8.3, 8.4). Used as fallback when versions-from-env is on but .env has no DOCKER_PHP_VERSION."
        required: false
        type: string
        default: "8.4"
      versions-from-env:
        description: "Read PHP version from the repo's .env (DOCKER_PHP_VERSION) — single source of truth, same as dev-compose."
        required: false
        type: boolean
        default: false
      env-file:
        description: "Path to the .env file to read the PHP version from (when versions-from-env is true)"
        required: false
        type: string
        default: ".env"
      # --- Pimcore-specific ---
      pimcore:
        description: "Enable Pimcore-specific steps (build:classes, cache warmup)"
        required: false
        type: boolean
        default: true
      # --- Which checks to run ---
      ecs:
        description: "Run ECS (Easy Coding Standard)"
        required: false
        type: boolean
        default: true
      ecs-paths:
        description: "Paths for ECS (space-separated)"
        required: false
        type: string
        default: "src"
      phpstan:
        description: "Run PHPStan"
        required: false
        type: boolean
        default: false
      phpstan-config:
        description: "PHPStan config file (empty = default)"
        required: false
        type: string
        default: ""
      psalm:
        description: "Run Psalm"
        required: false
        type: boolean
        default: false
      psalm-paths:
        description: "Paths for Psalm"
        required: false
        type: string
        default: "src"
      lint-twig:
        description: "Run Twig linting"
        required: false
        type: boolean
        default: true
      lint-twig-paths:
        description: "Paths for Twig linting (space-separated)"
        required: false
        type: string
        default: "templates"
      lint-yaml:
        description: "Run YAML linting"
        required: false
        type: boolean
        default: true
      lint-yaml-paths:
        description: "Paths for YAML linting (space-separated)"
        required: false
        type: string
        default: "config"
      lint-container:
        description: "Run Symfony container linting"
        required: false
        type: boolean
        default: true
      # --- PHPUnit ---
      phpunit:
        description: "Run PHPUnit without database. Skipped when the repo has no phpunit.xml(.dist) or no *Test.php outside phpunit-functional-path, so it is safe to enable for repos without tests"
        required: false
        type: boolean
        default: false
      phpunit-args:
        description: "Arguments for the PHPUnit job. Empty = all test suites except \"functional\""
        required: false
        type: string
        default: ""
      phpunit-functional:
        description: "Run functional PHPUnit tests against an installed Pimcore (MySQL + OpenSearch service containers). Skipped when phpunit-functional-path contains no *Test.php. The tests run with PIMCORE_FUNCTIONAL=1"
        required: false
        type: boolean
        default: false
      phpunit-functional-path:
        description: "Directory of the functional tests (detection only)"
        required: false
        type: string
        default: "tests/Functional"
      phpunit-functional-args:
        description: "Arguments for the functional PHPUnit job"
        required: false
        type: string
        default: "--testsuite functional"
      pimcore-install-args:
        description: "Arguments for vendor/bin/pimcore-install in the functional job (e.g. --install-profile=App\\InstallProfile\\StudioInstallProfile)"
        required: false
        type: string
        default: ""
      functional-mysql-image:
        description: "MySQL service image of the functional job"
        required: false
        type: string
        default: "mysql:8.0"
      functional-opensearch-image:
        description: "OpenSearch service image of the functional job, empty = no OpenSearch"
        required: false
        type: string
        default: "opensearchproject/opensearch:2.13.0"
    secrets:
      composer_auth:
        description: "Composer auth JSON for private packages (base — e.g. org-wide cors.repo.packagist token)"
        required: false
      composer_auth_extra:
        description: "Additional Composer auth JSON, merged per-host with composer_auth (e.g. repo.pimcore.com or a repo-specific token)"
        required: false
      env_local:
        description: "dotenv content written to .env.local before the kernel boots (e.g. PIMCORE_PRODUCT_KEY / PIMCORE_ENCRYPTION_SECRET). Lines with an empty value are dropped, so unset secrets fall back to the committed .env"
        required: false

# COMPOSER_AUTH is composed per-job from composer_auth + composer_auth_extra
# (see "Setup composer auth" steps) so a repo-specific token overrides the base.

jobs:
  # ===========================================================================
  # Resolve PHP version (from .env when versions-from-env is on, else input)
  # ===========================================================================
  resolve-versions:
    name: "Resolve versions"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      php-version: ${{ steps.v.outputs.php }}
      has-unit-tests: ${{ steps.t.outputs.unit }}
      has-functional-tests: ${{ steps.t.outputs.functional }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve PHP version
        id: v
        env:
          FROM_ENV: ${{ inputs.versions-from-env }}
          ENV_FILE: ${{ inputs.env-file }}
          IN_PHP: ${{ inputs.php-version }}
        run: |
          # .env authoritative when versions-from-env is on; input is the fallback.
          php="$IN_PHP"
          if [ "$FROM_ENV" = "true" ] && [ -f "$ENV_FILE" ]; then
            ev=$(sed -nE "s/^[[:space:]]*DOCKER_PHP_VERSION=[\"']?([^\"'#[:space:]]+).*/\1/p" "$ENV_FILE" | head -1)
            [ -n "$ev" ] && php="$ev"
            echo "Resolved from ${ENV_FILE}: php=${php}"
          fi
          echo "php=${php}" >> "$GITHUB_OUTPUT"

      - name: Detect PHPUnit tests
        id: t
        env:
          FUNCTIONAL_PATH: ${{ inputs.phpunit-functional-path }}
        run: |
          # Not every repo has tests yet: the PHPUnit jobs only run where there is something to run.
          # An empty suite directory (e.g. tests/Functional/.gitkeep) does not count.
          unit=false
          functional=false
          functional_path="${FUNCTIONAL_PATH%/}"
          if [ -f phpunit.xml.dist ] || [ -f phpunit.xml ]; then
            if [ -d tests ] && find tests -name '*Test.php' -not -path "${functional_path}/*" | grep -q .; then
              unit=true
            fi
            if [ -d "$functional_path" ] && find "$functional_path" -name '*Test.php' | grep -q .; then
              functional=true
            fi
          fi
          echo "PHPUnit tests: unit=${unit} functional=${functional}"
          echo "unit=${unit}" >> "$GITHUB_OUTPUT"
          echo "functional=${functional}" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # ECS + Symfony Linting (Twig, YAML, Container)
  # ===========================================================================
  lint:
    name: "Lint"
    needs: resolve-versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ needs.resolve-versions.outputs.php-version }}
          extensions: ctype, iconv, pdo_mysql, intl, zip, gd, mbstring, dom, xml
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.composer-cache.outputs.dir }}
            vendor
          key: ${{ runner.os }}-php${{ needs.resolve-versions.outputs.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php${{ needs.resolve-versions.outputs.php-version }}-

      - name: Setup composer auth
        env:
          BASE: ${{ secrets.composer_auth }}
          EXTRA: ${{ secrets.composer_auth_extra }}
        run: |
          # Deep-merge base + extra (extra wins on host conflicts) into a single
          # COMPOSER_AUTH for all following steps. One authoritative source — no
          # ambiguity between env and auth.json file precedence.
          merged=$(jq -cn --argjson a "${BASE:-{\}}" --argjson b "${EXTRA:-{\}}" '$a * $b')
          echo "::add-mask::$merged"
          echo "COMPOSER_AUTH=$merged" >> "$GITHUB_ENV"
          echo "Composed COMPOSER_AUTH from $(jq -rn --argjson a "${BASE:-{\}}" '($a["http-basic"]//{}|keys|length)') base + $(jq -rn --argjson b "${EXTRA:-{\}}" '($b["http-basic"]//{}|keys|length)') extra host(s)"

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: Write .env.local
        env:
          ENV_LOCAL: ${{ secrets.env_local }}
        run: |
          # Lines with an empty value (KEY=) are dropped: an unset repo secret must not
          # override a value the project ships in its committed .env.
          printf '%s\n' "$ENV_LOCAL" | grep -Ev '^[A-Za-z_][A-Za-z0-9_]*=\s*$' | grep -v '^\s*$' > .env.local || true
          if [ -s .env.local ]; then
            echo "Wrote .env.local ($(grep -c '=' .env.local) variables)"
          else
            rm -f .env.local
            echo "No .env.local written (no non-empty variables)"
          fi

      - name: Build Pimcore classes
        if: inputs.pimcore
        run: PIMCORE_DISABLE_CACHE=1 bin/console pimcore:build:classes --env=dev
        env:
          APP_ENV: dev

      - name: Warm up cache
        if: inputs.pimcore
        run: PIMCORE_DISABLE_CACHE=1 APP_DEBUG=1 bin/console cache:clear --env=dev
        env:
          APP_ENV: dev

      - name: ECS
        if: inputs.ecs
        env:
          ECS_PATHS: ${{ inputs.ecs-paths }}
        run: vendor/bin/ecs check $ECS_PATHS

      - name: Lint Twig
        if: inputs.lint-twig
        env:
          TWIG_PATHS: ${{ inputs.lint-twig-paths }}
        run: |
          for path in $TWIG_PATHS; do
            if [ -d "$path" ]; then
              bin/console lint:twig "$path"
            fi
          done

      - name: Lint YAML
        if: inputs.lint-yaml
        env:
          YAML_PATHS: ${{ inputs.lint-yaml-paths }}
        run: bin/console lint:yaml $YAML_PATHS --parse-tags --no-debug

      - name: Lint Container
        if: inputs.lint-container
        run: bin/console lint:container

  # ===========================================================================
  # PHPStan (separate job — runs in parallel with lint)
  # ===========================================================================
  phpstan:
    name: "PHPStan"
    if: inputs.phpstan
    needs: resolve-versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ needs.resolve-versions.outputs.php-version }}
          extensions: ctype, iconv, pdo_mysql, intl, zip, gd, mbstring, dom, xml
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.composer-cache.outputs.dir }}
            vendor
          key: ${{ runner.os }}-php${{ needs.resolve-versions.outputs.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php${{ needs.resolve-versions.outputs.php-version }}-

      - name: Setup composer auth
        env:
          BASE: ${{ secrets.composer_auth }}
          EXTRA: ${{ secrets.composer_auth_extra }}
        run: |
          # Deep-merge base + extra (extra wins on host conflicts) into a single
          # COMPOSER_AUTH for all following steps. One authoritative source — no
          # ambiguity between env and auth.json file precedence.
          merged=$(jq -cn --argjson a "${BASE:-{\}}" --argjson b "${EXTRA:-{\}}" '$a * $b')
          echo "::add-mask::$merged"
          echo "COMPOSER_AUTH=$merged" >> "$GITHUB_ENV"
          echo "Composed COMPOSER_AUTH from $(jq -rn --argjson a "${BASE:-{\}}" '($a["http-basic"]//{}|keys|length)') base + $(jq -rn --argjson b "${EXTRA:-{\}}" '($b["http-basic"]//{}|keys|length)') extra host(s)"

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: Write .env.local
        env:
          ENV_LOCAL: ${{ secrets.env_local }}
        run: |
          # Lines with an empty value (KEY=) are dropped: an unset repo secret must not
          # override a value the project ships in its committed .env.
          printf '%s\n' "$ENV_LOCAL" | grep -Ev '^[A-Za-z_][A-Za-z0-9_]*=\s*$' | grep -v '^\s*$' > .env.local || true
          if [ -s .env.local ]; then
            echo "Wrote .env.local ($(grep -c '=' .env.local) variables)"
          else
            rm -f .env.local
            echo "No .env.local written (no non-empty variables)"
          fi

      - name: Build Pimcore classes
        if: inputs.pimcore
        run: PIMCORE_DISABLE_CACHE=1 bin/console pimcore:build:classes --env=dev
        env:
          APP_ENV: dev

      - name: Warm up cache
        run: bin/console cache:warmup --env=dev
        env:
          APP_ENV: dev

      - name: PHPStan
        env:
          PHPSTAN_CONFIG: ${{ inputs.phpstan-config }}
        run: |
          if [ -n "$PHPSTAN_CONFIG" ]; then
            vendor/bin/phpstan analyse -c "$PHPSTAN_CONFIG"
          else
            vendor/bin/phpstan analyse
          fi

  # ===========================================================================
  # Psalm (separate job — runs in parallel with lint)
  # ===========================================================================
  psalm:
    name: "Psalm"
    if: inputs.psalm
    needs: resolve-versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ needs.resolve-versions.outputs.php-version }}
          extensions: ctype, iconv, pdo_mysql, intl, zip, gd, mbstring, dom, xml
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.composer-cache.outputs.dir }}
            vendor
          key: ${{ runner.os }}-php${{ needs.resolve-versions.outputs.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php${{ needs.resolve-versions.outputs.php-version }}-

      - name: Setup composer auth
        env:
          BASE: ${{ secrets.composer_auth }}
          EXTRA: ${{ secrets.composer_auth_extra }}
        run: |
          # Deep-merge base + extra (extra wins on host conflicts) into a single
          # COMPOSER_AUTH for all following steps. One authoritative source — no
          # ambiguity between env and auth.json file precedence.
          merged=$(jq -cn --argjson a "${BASE:-{\}}" --argjson b "${EXTRA:-{\}}" '$a * $b')
          echo "::add-mask::$merged"
          echo "COMPOSER_AUTH=$merged" >> "$GITHUB_ENV"
          echo "Composed COMPOSER_AUTH from $(jq -rn --argjson a "${BASE:-{\}}" '($a["http-basic"]//{}|keys|length)') base + $(jq -rn --argjson b "${EXTRA:-{\}}" '($b["http-basic"]//{}|keys|length)') extra host(s)"

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: Write .env.local
        env:
          ENV_LOCAL: ${{ secrets.env_local }}
        run: |
          # Lines with an empty value (KEY=) are dropped: an unset repo secret must not
          # override a value the project ships in its committed .env.
          printf '%s\n' "$ENV_LOCAL" | grep -Ev '^[A-Za-z_][A-Za-z0-9_]*=\s*$' | grep -v '^\s*$' > .env.local || true
          if [ -s .env.local ]; then
            echo "Wrote .env.local ($(grep -c '=' .env.local) variables)"
          else
            rm -f .env.local
            echo "No .env.local written (no non-empty variables)"
          fi

      - name: Build Pimcore classes
        if: inputs.pimcore
        run: PIMCORE_DISABLE_CACHE=1 bin/console pimcore:build:classes --env=dev
        env:
          APP_ENV: dev

      - name: Psalm
        env:
          PSALM_PATHS: ${{ inputs.psalm-paths }}
        run: vendor/bin/psalm $PSALM_PATHS

  # ===========================================================================
  # PHPUnit without database (separate job — runs in parallel with lint)
  # ===========================================================================
  phpunit:
    name: "PHPUnit"
    if: inputs.phpunit && needs.resolve-versions.outputs.has-unit-tests == 'true'
    needs: resolve-versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ needs.resolve-versions.outputs.php-version }}
          extensions: ctype, iconv, pdo_mysql, intl, zip, gd, mbstring, dom, xml
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.composer-cache.outputs.dir }}
            vendor
          key: ${{ runner.os }}-php${{ needs.resolve-versions.outputs.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php${{ needs.resolve-versions.outputs.php-version }}-

      - name: Setup composer auth
        env:
          BASE: ${{ secrets.composer_auth }}
          EXTRA: ${{ secrets.composer_auth_extra }}
        run: |
          # Deep-merge base + extra (extra wins on host conflicts) into a single
          # COMPOSER_AUTH for all following steps. One authoritative source — no
          # ambiguity between env and auth.json file precedence.
          merged=$(jq -cn --argjson a "${BASE:-{\}}" --argjson b "${EXTRA:-{\}}" '$a * $b')
          echo "::add-mask::$merged"
          echo "COMPOSER_AUTH=$merged" >> "$GITHUB_ENV"
          echo "Composed COMPOSER_AUTH from $(jq -rn --argjson a "${BASE:-{\}}" '($a["http-basic"]//{}|keys|length)') base + $(jq -rn --argjson b "${EXTRA:-{\}}" '($b["http-basic"]//{}|keys|length)') extra host(s)"

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: Write .env.local
        env:
          ENV_LOCAL: ${{ secrets.env_local }}
        run: |
          # Lines with an empty value (KEY=) are dropped: an unset repo secret must not
          # override a value the project ships in its committed .env.
          printf '%s\n' "$ENV_LOCAL" | grep -Ev '^[A-Za-z_][A-Za-z0-9_]*=\s*$' | grep -v '^\s*$' > .env.local || true
          if [ -s .env.local ]; then
            echo "Wrote .env.local ($(grep -c '=' .env.local) variables)"
          else
            rm -f .env.local
            echo "No .env.local written (no non-empty variables)"
          fi

      - name: Build Pimcore classes
        if: inputs.pimcore
        run: PIMCORE_DISABLE_CACHE=1 bin/console pimcore:build:classes --env=dev
        env:
          APP_ENV: dev

      - name: PHPUnit
        env:
          PHPUNIT_ARGS: ${{ inputs.phpunit-args }}
        run: |
          # The functional suite needs an installed Pimcore and runs in its own job
          if [ -z "$PHPUNIT_ARGS" ]; then
            PHPUNIT_ARGS="--exclude-testsuite functional"
          fi
          vendor/bin/phpunit $PHPUNIT_ARGS

  # ===========================================================================
  # PHPUnit functional tests against an installed Pimcore (MySQL + OpenSearch)
  # ===========================================================================
  phpunit-functional:
    name: "PHPUnit (functional)"
    if: inputs.phpunit-functional && needs.resolve-versions.outputs.has-functional-tests == 'true'
    needs: resolve-versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      mysql:
        image: ${{ inputs.functional-mysql-image }}
        env:
          MYSQL_DATABASE: pimcore
          MYSQL_USER: pimcore
          MYSQL_PASSWORD: pimcore
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      opensearch:
        # an empty image skips the service
        image: ${{ inputs.functional-opensearch-image }}
        env:
          discovery.type: single-node
          plugins.security.disabled: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: Op3nSearch!
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      APP_ENV: dev
      # Real environment variables win over .env/.env.local, the services replace the dev-compose hosts
      DATABASE_URL: mysql://pimcore:pimcore@127.0.0.1:3306/pimcore?serverVersion=8.0.26
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "3306"
      DATABASE_USER: pimcore
      DATABASE_PASSWORD: pimcore
      DATABASE_NAME: pimcore
      PIMCORE_OPENSEARCH_DSN: opensearch://127.0.0.1:9200?ssl=false
      PIMCORE_INSTALL_MYSQL_HOST_SOCKET: 127.0.0.1
      PIMCORE_INSTALL_MYSQL_PORT: "3306"
      PIMCORE_INSTALL_MYSQL_USERNAME: pimcore
      PIMCORE_INSTALL_MYSQL_PASSWORD: pimcore
      PIMCORE_INSTALL_MYSQL_DATABASE: pimcore
      PIMCORE_INSTALL_SKIP_DATABASE_CONFIG: "true"
      PIMCORE_INSTALL_ADMIN_USERNAME: admin
      PIMCORE_INSTALL_ADMIN_PASSWORD: admin
      PIMCORE_FUNCTIONAL: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ needs.resolve-versions.outputs.php-version }}
          extensions: ctype, iconv, pdo_mysql, intl, zip, gd, mbstring, dom, xml
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.composer-cache.outputs.dir }}
            vendor
          key: ${{ runner.os }}-php${{ needs.resolve-versions.outputs.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php${{ needs.resolve-versions.outputs.php-version }}-

      - name: Setup composer auth
        env:
          BASE: ${{ secrets.composer_auth }}
          EXTRA: ${{ secrets.composer_auth_extra }}
        run: |
          # Deep-merge base + extra (extra wins on host conflicts) into a single
          # COMPOSER_AUTH for all following steps. One authoritative source — no
          # ambiguity between env and auth.json file precedence.
          merged=$(jq -cn --argjson a "${BASE:-{\}}" --argjson b "${EXTRA:-{\}}" '$a * $b')
          echo "::add-mask::$merged"
          echo "COMPOSER_AUTH=$merged" >> "$GITHUB_ENV"
          echo "Composed COMPOSER_AUTH from $(jq -rn --argjson a "${BASE:-{\}}" '($a["http-basic"]//{}|keys|length)') base + $(jq -rn --argjson b "${EXTRA:-{\}}" '($b["http-basic"]//{}|keys|length)') extra host(s)"

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: Write .env.local
        env:
          ENV_LOCAL: ${{ secrets.env_local }}
        run: |
          # Lines with an empty value (KEY=) are dropped: an unset repo secret must not
          # override a value the project ships in its committed .env.
          printf '%s\n' "$ENV_LOCAL" | grep -Ev '^[A-Za-z_][A-Za-z0-9_]*=\s*$' | grep -v '^\s*$' > .env.local || true
          if [ -s .env.local ]; then
            echo "Wrote .env.local ($(grep -c '=' .env.local) variables)"
          else
            rm -f .env.local
            echo "No .env.local written (no non-empty variables)"
          fi

      - name: Install Pimcore
        env:
          PIMCORE_INSTALL_ARGS: ${{ inputs.pimcore-install-args }}
        run: vendor/bin/pimcore-install $PIMCORE_INSTALL_ARGS --no-interaction

      - name: PHPUnit (functional)
        env:
          PHPUNIT_ARGS: ${{ inputs.phpunit-functional-args }}
        run: vendor/bin/phpunit $PHPUNIT_ARGS

  # ===========================================================================
  # Gate job — ensures the workflow is never fully skipped
  # ===========================================================================
  complete:
    name: "Tests Complete"
    if: always()
    needs: [lint, phpstan, psalm, phpunit, phpunit-functional]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check status
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          PHPSTAN_RESULT: ${{ needs.phpstan.result }}
          PSALM_RESULT: ${{ needs.psalm.result }}
          PHPUNIT_RESULT: ${{ needs.phpunit.result }}
          PHPUNIT_FUNCTIONAL_RESULT: ${{ needs.phpunit-functional.result }}
        run: |
          for result in "$LINT_RESULT" "$PHPSTAN_RESULT" "$PSALM_RESULT" "$PHPUNIT_RESULT" "$PHPUNIT_FUNCTIONAL_RESULT"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "Job failed or was cancelled: $result"
              exit 1
            fi
          done
          echo "All tests passed or were skipped"
