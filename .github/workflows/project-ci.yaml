name: "⚙️ Project CI"

# One-stop CI/CD for a CORS Pimcore project: test → build → update manifest.
# Projects call this with a thin caller that only carries triggers — the caller
# is identical in every project repo and distributed by the file sync from
# shared-workflows-private. Project specifics are derived from the repo name
# (registry path cors-wolke/cors/<repo>, manifest repo <repo>-manifest) and can
# be overridden per repo via the repository variables GCP_REGISTRY_PATH, CD_REPO
# and NGINX_VERSION — or explicitly via inputs. Build and manifest run only on
# push, after tests pass, and can be toggled off individually.

on:
  workflow_call:
    inputs:
      # --- Tests (forwarded to php-test.yaml) ---
      versions-from-env:
        description: "Read PHP/image versions from the repo's .env (single source of truth)"
        required: false
        type: boolean
        default: true
      pimcore:
        required: false
        type: boolean
        default: true
      ecs:
        required: false
        type: boolean
        default: true
      phpstan:
        required: false
        type: boolean
        default: false
      psalm:
        required: false
        type: boolean
        default: false
      lint-twig:
        required: false
        type: boolean
        default: true
      lint-yaml:
        required: false
        type: boolean
        default: true
      lint-container:
        required: false
        type: boolean
        default: true
      symfony-lsp:
        description: "Run symfony lsp:check (Symfony-aware diagnostics: routes, templates, translations, services, config)"
        required: false
        type: boolean
        default: false
      symfony-lsp-args:
        description: "Extra arguments for symfony lsp:check (e.g. paths, --source-only, --baseline=...)"
        required: false
        type: string
        default: ""
      # --- Build (forwarded to containerize.yaml) ---
      build:
        description: "Build & push a container image on push (after tests)"
        required: false
        type: boolean
        default: true
      registry:
        description: "Container registry type: ghcr or gcp"
        required: false
        type: string
        default: "gcp"
      gcp-registry-url:
        required: false
        type: string
        default: "europe-west3-docker.pkg.dev"
      gcp-registry-path:
        description: "GCP registry path after URL. Default: repo variable GCP_REGISTRY_PATH, else cors-wolke/cors/<repo name>"
        required: false
        type: string
        default: ""
      dockerfile:
        required: false
        type: string
        default: "Dockerfile"
      nginx-version:
        description: "NGINX_VERSION build arg (usually not in .env). Default: repo variable NGINX_VERSION, else 1.29"
        required: false
        type: string
        default: ""
      # --- Maintenance page ---
      maintenance:
        description: >-
          Build & push the maintenance page in .maintenance/ (index.html plus any assets it references) as
          <registry>/maintenance:<tag>, on top of maintenance-base-image. Repos without .maintenance/index.html,
          or still carrying their own .maintenance/Dockerfile, are left alone.
        required: false
        type: boolean
        default: true
      maintenance-base-image:
        description: "Base image for the maintenance page (private GHCR package, the repo needs read access to it)"
        required: false
        type: string
        default: "ghcr.io/cors-gmbh/maintenance-page:1"
      # --- Manifest / CD (forwarded to update-manifest.yaml) ---
      update-manifest:
        description: "Bump image tags in the CD/ArgoCD manifest repo after build"
        required: false
        type: boolean
        default: true
      manifest-strategy:
        description: "Manifest update strategy: yq or gitops"
        required: false
        type: string
        default: "yq"
      cd-repo:
        description: "CD/manifest repository name within the same org. Default: repo variable CD_REPO, else <repo name>-manifest"
        required: false
        type: string
        default: ""
      yq-expressions:
        description: "Newline-separated yq expressions ($TAG is replaced with the image tag)"
        required: false
        type: string
        default: |
          .pimcore.pimcore.image.tag = "$TAG"
          .pimcore.nginx.image.tag = "$TAG"
          .pimcore.supervisord.image.tag = "$TAG"
          .pimcore.pimcore.cli.image.tag = "$TAG"
    secrets:
      composer_auth:
        required: false
      composer_auth_extra:
        required: false
      env_local:
        description: "dotenv content written to .env.local in the test jobs (see php-test.yaml)"
        required: false
      gcp_credentials:
        required: false
      cd_push_token:
        required: false
      gh_app_private_key:
        required: false
      gh_app_id:
        required: false
      npm_github_pat:
        required: false

jobs:
  # --- Tests / lint / static analysis (push + PR) ---
  test:
    uses: ./.github/workflows/php-test.yaml
    with:
      versions-from-env: ${{ inputs.versions-from-env }}
      pimcore: ${{ inputs.pimcore }}
      ecs: ${{ inputs.ecs }}
      phpstan: ${{ inputs.phpstan }}
      psalm: ${{ inputs.psalm }}
      lint-twig: ${{ inputs.lint-twig }}
      lint-yaml: ${{ inputs.lint-yaml }}
      lint-container: ${{ inputs.lint-container }}
      symfony-lsp: ${{ inputs.symfony-lsp }}
      symfony-lsp-args: ${{ inputs.symfony-lsp-args }}
    secrets:
      composer_auth: ${{ secrets.composer_auth }}
      composer_auth_extra: ${{ secrets.composer_auth_extra }}
      env_local: ${{ secrets.env_local }}

  # --- Resolve image tag (<branch>-<short-sha>), APP_ENV and project targets (push + build only) ---
  prep:
    name: "Resolve tag & env"
    if: github.event_name == 'push' && inputs.build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.m.outputs.tag }}
      app-env: ${{ steps.m.outputs.app_env }}
      registry-path: ${{ steps.t.outputs.registry_path }}
      cd-repo: ${{ steps.t.outputs.cd_repo }}
      nginx-version: ${{ steps.t.outputs.nginx_version }}
    steps:
      - name: Map branch to tag & env
        id: m
        env:
          PROD_BRANCH: ${{ vars.PROD_BRANCH || 'main' }}
          STAGE_BRANCH: ${{ vars.STAGE_BRANCH || 'staging' }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          echo "tag=${REF}-${SHA:0:8}" >> "$GITHUB_OUTPUT"
          if [ "$REF" = "$PROD_BRANCH" ]; then
            env=prod
          elif [ "$REF" = "$STAGE_BRANCH" ]; then
            env=staging
          else
            env="$REF"
          fi
          echo "app_env=${env}" >> "$GITHUB_OUTPUT"

      - name: Resolve registry path, CD repo & nginx version
        id: t
        env:
          # Precedence: explicit input > repository variable > convention from the repo name.
          # Lets the caller ci.yaml stay identical across projects (file sync).
          REGISTRY_PATH: ${{ inputs.gcp-registry-path || vars.GCP_REGISTRY_PATH }}
          CD_REPO: ${{ inputs.cd-repo || vars.CD_REPO }}
          NGINX: ${{ inputs.nginx-version || vars.NGINX_VERSION || '1.29' }}
          REPO: ${{ github.event.repository.name }}
        run: |
          # Registry paths must be lowercase; repo names may not be (e.g. ZeroRidge).
          repo=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
          echo "registry_path=${REGISTRY_PATH:-cors-wolke/cors/${repo}}" >> "$GITHUB_OUTPUT"
          echo "cd_repo=${CD_REPO:-${repo}-manifest}" >> "$GITHUB_OUTPUT"
          echo "nginx_version=${NGINX}" >> "$GITHUB_OUTPUT"
          echo "registry path: ${REGISTRY_PATH:-cors-wolke/cors/${repo}} — CD repo: ${CD_REPO:-${repo}-manifest} — nginx: ${NGINX}"

  # --- Build & push all targets (after tests) ---
  build:
    name: "Containerize"
    needs: prep
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/containerize.yaml
    with:
      container-tag: ${{ needs.prep.outputs.tag }}
      app-env: ${{ needs.prep.outputs.app-env }}
      push-latest: true
      branch-name: ${{ github.ref_name }}
      registry: ${{ inputs.registry }}
      gcp-registry-url: ${{ inputs.gcp-registry-url }}
      gcp-registry-path: ${{ needs.prep.outputs.registry-path }}
      dockerfile: ${{ inputs.dockerfile }}
      versions-from-env: ${{ inputs.versions-from-env }}
      nginx-version: ${{ needs.prep.outputs.nginx-version }}
    secrets:
      composer_auth: ${{ secrets.composer_auth }}
      composer_auth_extra: ${{ secrets.composer_auth_extra }}
      gcp_credentials: ${{ secrets.gcp_credentials }}
      npm_github_pat: ${{ secrets.npm_github_pat }}

  # --- Maintenance page: .maintenance/ copied onto the shared base image ---
  # Same tag as the Pimcore image, which is what the manifest's maintenance
  # deployment pulls. Skipping happens per step, not per job: a skipped job
  # would also skip update-manifest, which needs this one.
  maintenance:
    name: "Maintenance page"
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: .maintenance

      - name: Detect page
        id: page
        env:
          ENABLED: ${{ inputs.maintenance }}
          BASE_IMAGE: ${{ inputs.maintenance-base-image }}
        run: |
          if [ "$ENABLED" != "true" ]; then
            echo "Disabled via the maintenance input."
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif [ ! -f .maintenance/index.html ]; then
            echo "No .maintenance/index.html, nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif [ -f .maintenance/Dockerfile ]; then
            echo "::notice title=Maintenance page::.maintenance/Dockerfile found: legacy setup, built by the repo's own workflow. Delete .maintenance/{Dockerfile,server.go,go.mod,go.sum} and .github/workflows/maintenance.yaml to build on ${BASE_IMAGE}."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            printf 'FROM %s\nCOPY . /www/\n' "$BASE_IMAGE" > "$RUNNER_TEMP/Dockerfile.maintenance"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.page.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR (base image)
        if: steps.page.outputs.build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GCP Artifact Registry
        if: steps.page.outputs.build == 'true' && inputs.registry == 'gcp'
        env:
          GCP_CREDENTIALS: ${{ secrets.gcp_credentials }}
          GCP_REGISTRY_URL: ${{ inputs.gcp-registry-url }}
        run: |
          echo "$GCP_CREDENTIALS" | base64 -d | \
            docker login -u _json_key --password-stdin "https://${GCP_REGISTRY_URL}"

      - name: Resolve image
        id: image
        if: steps.page.outputs.build == 'true'
        env:
          REGISTRY_TYPE: ${{ inputs.registry }}
          REPO_OWNER: ${{ github.repository_owner }}
          GCP_REGISTRY_URL: ${{ inputs.gcp-registry-url }}
          GCP_REGISTRY_PATH: ${{ needs.prep.outputs.registry-path }}
          TAG: ${{ needs.prep.outputs.tag }}
        run: |
          # Same prefix as containerize.yaml, so the page lands next to the Pimcore image.
          if [ "$REGISTRY_TYPE" = "ghcr" ]; then
            prefix="ghcr.io/$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')"
          else
            prefix="${GCP_REGISTRY_URL}/${GCP_REGISTRY_PATH}"
          fi
          echo "ref=${prefix}/maintenance:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build & push
        if: steps.page.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .maintenance
          file: ${{ runner.temp }}/Dockerfile.maintenance
          pull: true
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.ref }}

  # --- Bump image tags in the CD/manifest repo (after build) ---
  update-manifest:
    name: "Update manifest"
    if: inputs.update-manifest
    needs: [prep, build, maintenance]
    uses: ./.github/workflows/update-manifest.yaml
    with:
      container-tag: ${{ needs.prep.outputs.tag }}
      strategy: ${{ inputs.manifest-strategy }}
      cd-repo: ${{ needs.prep.outputs.cd-repo }}
      cd-repo-branch: ${{ github.ref_name }}
      yq-expressions: ${{ inputs.yq-expressions }}
    secrets:
      cd_push_token: ${{ secrets.cd_push_token }}
      gh_app_private_key: ${{ secrets.gh_app_private_key }}
      gh_app_id: ${{ secrets.gh_app_id }}
