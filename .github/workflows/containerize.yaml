name: "⚙️ Containerize"

on:
  workflow_call:
    inputs:
      container-tag:
        description: "Docker image tag (e.g. develop-abcd1234)"
        required: true
        type: string
      app-env:
        description: "APP_ENV for the build (staging, prod, pr)"
        required: false
        type: string
        default: "staging"
      push-latest:
        description: "Also push :branch-latest tags"
        required: false
        type: boolean
        default: false
      branch-name:
        description: "Branch name for latest tag (e.g. develop, main)"
        required: false
        type: string
        default: ""
      # --- Registry ---
      registry:
        description: "Container registry type: ghcr or gcp"
        required: false
        type: string
        default: "ghcr"
      gcp-registry-url:
        description: "GCP Artifact Registry URL (only for registry=gcp)"
        required: false
        type: string
        default: "europe-west3-docker.pkg.dev"
      gcp-registry-path:
        description: "GCP registry path after URL (e.g. cors-wolke/cors/docker)"
        required: false
        type: string
        default: ""
      # --- Build targets ---
      targets:
        description: >-
          JSON array of build targets, e.g. [{"target":"cors_php","image":"php-alpine-fpm"},...].
          Targets whose stage does not exist in the Dockerfile are dropped before any runner starts, so the default
          covers both the pimcore-docker 9.x layout (fpm, blackfire, supervisord, cli, nginx)
          and the 10.x layout (one cors_php image plus nginx).
        required: false
        type: string
        default: >-
          [
            {"target":"cors_php","image":"php-alpine-fpm"},
            {"target":"cors_php_blackfire","image":"php-alpine-fpm-blackfire"},
            {"target":"cors_php_supervisord","image":"php-alpine-supervisord"},
            {"target":"cors_php_cli","image":"php-alpine-cli"},
            {"target":"cors_nginx","image":"nginx"}
          ]
      single-image-name:
        description: >-
          Image name for the PHP target of a pimcore-docker >= 10 project (its stage builds FROM
          pimcore-docker/pimcore or pimcore-slim). Replaces the legacy name "php-alpine-fpm": the
          image is no longer an fpm-only image, it also runs cli, workers and the blackfire probe.
        required: false
        type: string
        default: "php-alpine"
      legacy-image-alias:
        description: >-
          Transition aid: also push the single image under its legacy name (php-alpine-fpm), so
          manifests that still reference the old name keep resolving. Turn off once every manifest
          points at single-image-name.
        required: false
        type: boolean
        default: true
      # --- Build args ---
      dockerfile:
        description: "Dockerfile path"
        required: false
        type: string
        default: "Dockerfile"
      versions-from-env:
        description: "Read image versions (PHP/Alpine/Base) from the repo's .env (single source of truth, same as dev-compose). Explicit inputs below override .env."
        required: false
        type: boolean
        default: false
      env-file:
        description: "Path to the .env file to read versions from (when versions-from-env is true)"
        required: false
        type: string
        default: ".env"
      docker-base-version:
        description: "DOCKER_BASE_VERSION build arg (overrides .env DOCKER_BASE_IMAGE)"
        required: false
        type: string
        default: ""
      php-version:
        description: "PHP_VERSION build arg"
        required: false
        type: string
        default: ""
      nginx-version:
        description: "NGINX_VERSION build arg. Fallback when .env has no DOCKER_NGINX_VERSION (most .env files don't carry nginx)."
        required: false
        type: string
        default: ""
      alpine-version:
        description: "ALPINE_VERSION build arg"
        required: false
        type: string
        default: ""
    secrets:
      composer_auth:
        description: "Composer auth JSON for private packages (base — e.g. org-wide cors.repo.packagist token)"
        required: false
      composer_auth_extra:
        description: "Additional Composer auth JSON, merged with composer_auth (extra wins on host conflicts, e.g. repo.pimcore.com)"
        required: false
      gcp_credentials:
        description: "GCP service account key (base64, for registry=gcp)"
        required: false
      npm_github_pat:
        description: "GitHub PAT for npm packages"
        required: false
    outputs:
      image-tag:
        description: "The container image tag that was pushed"
        value: ${{ jobs.targets.outputs.image-tag }}

jobs:
  # Keep only the targets whose stage exists in the Dockerfile, so no runner is
  # started for the rest. pimcore-docker >= 10.0 ships one PHP image for fpm, cli,
  # supervisord and blackfire: those projects only define cors_php + cors_nginx,
  # older projects still define all four PHP stages. The default target list
  # therefore works for both without the caller overriding it.
  targets:
    name: "Resolve targets"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
      count: ${{ steps.filter.outputs.count }}
      image-tag: ${{ inputs.container-tag }}
    steps:
      - name: Checkout Dockerfile
        uses: actions/checkout@v7
        with:
          sparse-checkout: ${{ inputs.dockerfile }}
          sparse-checkout-cone-mode: false

      - name: Filter targets by Dockerfile stages
        id: filter
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          TARGETS: ${{ inputs.targets }}
          SINGLE_NAME: ${{ inputs.single-image-name }}
          LEGACY_ALIAS: ${{ inputs.legacy-image-alias }}
        run: |
          kept='[]'
          while IFS= read -r entry; do
            target="$(jq -r '.target' <<<"$entry")"
            from="$(grep -iE "^FROM[[:space:]].*[[:space:]]AS[[:space:]]+${target}[[:space:]]*(#.*)?$" "$DOCKERFILE" | head -1 || true)"
            if [ -n "$from" ]; then
              # pimcore-docker >= 10: the stage builds FROM the single `pimcore` image, so the
              # result is not an fpm-only image any more -> php-alpine instead of php-alpine-fpm.
              if [ "$(jq -r '.image' <<<"$entry")" = "php-alpine-fpm" ] && grep -qE "pimcore-docker/pimcore(-slim)?:" <<<"$from"; then
                alias=""; [ "$LEGACY_ALIAS" = "true" ] && alias="php-alpine-fpm"
                entry="$(jq -c --arg n "$SINGLE_NAME" --arg a "$alias" '.image = $n | .alias = $a' <<<"$entry")"
              fi
              kept="$(jq -c --argjson e "$entry" '. + [$e]' <<<"$kept")"
            else
              echo "::notice::Stage '${target}' not found in ${DOCKERFILE}, not building $(jq -r '.image' <<<"$entry")"
            fi
          done < <(jq -c '.[]' <<<"$TARGETS")
          echo "matrix=$kept" >> "$GITHUB_OUTPUT"
          echo "count=$(jq 'length' <<<"$kept")" >> "$GITHUB_OUTPUT"
          echo "Building: $(jq -r '[.[].image] | join(", ")' <<<"$kept")"

  build:
    name: "Build & Push"
    needs: targets
    if: needs.targets.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # --- GHCR Login ---
      - name: Log in to GHCR
        if: inputs.registry == 'ghcr'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- GCP Login ---
      - name: Log in to GCP Artifact Registry
        if: inputs.registry == 'gcp'
        env:
          GCP_CREDENTIALS: ${{ secrets.gcp_credentials }}
          GCP_REGISTRY_URL: ${{ inputs.gcp-registry-url }}
        run: |
          echo "$GCP_CREDENTIALS" | base64 -d | \
            docker login -u _json_key --password-stdin "https://${GCP_REGISTRY_URL}"

      # --- Determine registry prefix ---
      - name: Set registry prefix
        id: registry
        env:
          REGISTRY_TYPE: ${{ inputs.registry }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.repository }}
          GCP_REGISTRY_URL: ${{ inputs.gcp-registry-url }}
          GCP_REGISTRY_PATH: ${{ inputs.gcp-registry-path }}
        run: |
          if [ "$REGISTRY_TYPE" = "ghcr" ]; then
            OWNER=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
            echo "prefix=ghcr.io/${OWNER}" >> "$GITHUB_OUTPUT"
          else
            REPO_PATH=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')
            echo "prefix=${GCP_REGISTRY_URL}/${GCP_REGISTRY_PATH:-cors-wolke/${REPO_PATH}}" >> "$GITHUB_OUTPUT"
          fi

      # --- Prepare tags ---
      - name: Prepare tags
        id: tags
        env:
          REGISTRY_PREFIX: ${{ steps.registry.outputs.prefix }}
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_ALIAS: ${{ matrix.alias }}
          CONTAINER_TAG: ${{ inputs.container-tag }}
          PUSH_LATEST: ${{ inputs.push-latest }}
          BRANCH_NAME: ${{ inputs.branch-name }}
        run: |
          {
            echo "tags<<EOF"
            # the alias (legacy image name during the php-alpine-fpm -> php-alpine transition)
            # is the same build pushed under a second name, not a second build
            for name in "$IMAGE_NAME" $IMAGE_ALIAS; do
              IMAGE="${REGISTRY_PREFIX}/${name}"
              echo "${IMAGE}:${CONTAINER_TAG}"
              if [ "$PUSH_LATEST" = "true" ] && [ -n "$BRANCH_NAME" ]; then
                echo "${IMAGE}:${BRANCH_NAME}-latest"
              fi
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # --- Resolve image versions (explicit inputs win, else read from .env) ---
      - name: Resolve image versions
        id: versions
        env:
          FROM_ENV: ${{ inputs.versions-from-env }}
          ENV_FILE: ${{ inputs.env-file }}
          IN_PHP: ${{ inputs.php-version }}
          IN_ALPINE: ${{ inputs.alpine-version }}
          IN_BASE: ${{ inputs.docker-base-version }}
          IN_NGINX: ${{ inputs.nginx-version }}
        run: |
          # .env is authoritative when versions-from-env is on; inputs are the
          # fallback for keys absent from .env (e.g. nginx, which most .env files
          # don't carry — then the explicit nginx-version input is used).
          php="$IN_PHP"; alpine="$IN_ALPINE"; base="$IN_BASE"; nginx="$IN_NGINX"
          if [ "$FROM_ENV" = "true" ] && [ -f "$ENV_FILE" ]; then
            get() { sed -nE "s/^[[:space:]]*$1=[\"']?([^\"'#[:space:]]+).*/\1/p" "$ENV_FILE" | head -1; }
            ev=$(get DOCKER_PHP_VERSION);   [ -n "$ev" ] && php="$ev"
            ev=$(get DOCKER_ALPINE_VERSION); [ -n "$ev" ] && alpine="$ev"
            ev=$(get DOCKER_BASE_IMAGE);     [ -n "$ev" ] && base="$ev"
            ev=$(get DOCKER_NGINX_VERSION);  [ -n "$ev" ] && nginx="$ev"
            echo "Resolved from ${ENV_FILE}: php=${php} alpine=${alpine} base=${base} nginx=${nginx}"
          fi
          {
            echo "php=${php}"
            echo "alpine=${alpine}"
            echo "base=${base}"
            echo "nginx=${nginx}"
          } >> "$GITHUB_OUTPUT"

      # --- Prepare build args ---
      - name: Prepare build args
        id: build-args
        env:
          APP_ENV: ${{ inputs.app-env }}
          DOCKER_BASE_VERSION: ${{ steps.versions.outputs.base }}
          PHP_VERSION: ${{ steps.versions.outputs.php }}
          NGINX_VERSION: ${{ steps.versions.outputs.nginx }}
          ALPINE_VERSION: ${{ steps.versions.outputs.alpine }}
          NPM_GITHUB_PAT: ${{ secrets.npm_github_pat }}
        run: |
          {
            echo "args<<EOF"
            echo "APP_ENV=${APP_ENV}"
            [ -n "$DOCKER_BASE_VERSION" ] && echo "DOCKER_BASE_VERSION=${DOCKER_BASE_VERSION}"
            [ -n "$PHP_VERSION" ]          && echo "PHP_VERSION=${PHP_VERSION}"
            [ -n "$NGINX_VERSION" ]         && echo "NGINX_VERSION=${NGINX_VERSION}"
            [ -n "$ALPINE_VERSION" ]        && echo "ALPINE_VERSION=${ALPINE_VERSION}"
            [ -n "$NPM_GITHUB_PAT" ]        && echo "NPM_GITHUB_PAT=${NPM_GITHUB_PAT}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # --- Determine cache backend ---
      - name: Determine cache backend
        id: cache
        env:
          REGISTRY_TYPE: ${{ inputs.registry }}
          REGISTRY_PREFIX: ${{ steps.registry.outputs.prefix }}
          IMAGE_NAME: ${{ matrix.image }}
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$REGISTRY_TYPE" = "gcp" ]; then
            echo "from=type=registry,ref=${REGISTRY_PREFIX}/${IMAGE_NAME}:buildcache-${TARGET}" >> "$GITHUB_OUTPUT"
            echo "to=type=registry,ref=${REGISTRY_PREFIX}/${IMAGE_NAME}:buildcache-${TARGET},mode=max" >> "$GITHUB_OUTPUT"
          else
            echo "from=type=gha,scope=${TARGET}" >> "$GITHUB_OUTPUT"
            echo "to=type=gha,mode=max,scope=${TARGET}" >> "$GITHUB_OUTPUT"
          fi

      # --- Compose composer auth (base + extra, extra wins on host conflicts) ---
      - name: Compose composer auth
        env:
          BASE: ${{ secrets.composer_auth }}
          EXTRA: ${{ secrets.composer_auth_extra }}
        run: |
          merged=$(jq -cn --argjson a "${BASE:-{\}}" --argjson b "${EXTRA:-{\}}" '$a * $b')
          echo "::add-mask::$merged"
          echo "COMPOSER_AUTH=$merged" >> "$GITHUB_ENV"
          echo "Composed composer auth from $(jq -rn --argjson a "${BASE:-{\}}" '($a["http-basic"]//{}|keys|length)') base + $(jq -rn --argjson b "${EXTRA:-{\}}" '($b["http-basic"]//{}|keys|length)') extra host(s)"

      # --- Build & Push ---
      - name: Build and Push ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: ${{ steps.build-args.outputs.args }}
          secrets: |
            composer_auth=${{ env.COMPOSER_AUTH }}
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}