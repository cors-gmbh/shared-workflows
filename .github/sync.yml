# Sync-Konfiguration für BetaHuhn/repo-file-sync-action
# (ausgeführt von .github/workflows/sync-files.yml bei jedem Push auf main).
#
# Zwei Gruppen: Projekt-Repos und Bundle-Repos. Beide bekommen den passenden
# Guardrail-Caller nach .github/workflows/pr-guardrail.yml und das zentrale
# PR-Template.
#
# Neues Repo aufnehmen: Eintrag in der passenden repos-Liste ergänzen und auf
# main mergen — der Sync öffnet dann einen PR im Ziel-Repo.
# Siehe docs/GUARDRAILS.md, Abschnitt "Neues Repo in den Sync aufnehmen".
#
# WICHTIG: Innerhalb der `repos: |`-Blöcke sind KEINE Kommentare möglich —
# jede Zeile wird als Repo-Name interpretiert.

group:
  # ──────────────────────────────────────────────────────────────────────
  # Gruppe 1: Pimcore-PROJEKT-Repos
  # ➜ PLATZHALTER: echte Projekt-Repos eintragen, Beispiele ersetzen!
  # ──────────────────────────────────────────────────────────────────────
  - repos: |
      cors-gmbh/beispiel-projekt-a
      cors-gmbh/beispiel-projekt-b
    files:
      - source: templates/project/pr-guardrail.yml
        dest: .github/workflows/pr-guardrail.yml
      - source: templates/pull_request_template.md
        dest: .github/pull_request_template.md

  # ──────────────────────────────────────────────────────────────────────
  # Gruppe 2: Pimcore-BUNDLE-Repos
  # ➜ PLATZHALTER: echte Bundle-Repos eintragen, Beispiele ersetzen!
  # ──────────────────────────────────────────────────────────────────────
  - repos: |
      cors-gmbh/beispiel-bundle-a
      cors-gmbh/beispiel-bundle-b
    files:
      - source: templates/bundle/pr-guardrail.yml
        dest: .github/workflows/pr-guardrail.yml
      - source: templates/pull_request_template.md
        dest: .github/pull_request_template.md
