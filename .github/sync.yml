# Sync-Konfiguration für BetaHuhn/repo-file-sync-action
# (ausgeführt von .github/workflows/sync-files.yml bei jedem Push auf main).
#
# Jede Gruppe bekommt einen Guardrail-Caller nach
# .github/workflows/pr-guardrail.yml und ein PR-Template. Gruppen 1-4 nutzen
# dasselbe Enforce-Template; Gruppe 5 (öffentliche OSS-Repos) bekommt den
# Hinweismodus-Caller, Gruppe 6 (Manifest-Repos) einen Caller, der das Issue
# im Projekt-Repo sucht. Die Trennung erlaubt es, einzelnen Repo-Typen
# abweichende Inputs zu geben.
#
# Neues Repo aufnehmen: Eintrag in der passenden repos-Liste ergänzen und auf
# main mergen — der Sync öffnet dann einen PR im Ziel-Repo.
# Siehe docs/GUARDRAILS.md, Abschnitt "Neues Repo in den Sync aufnehmen".
#
# WICHTIG: Innerhalb der `repos: |`-Blöcke sind KEINE Kommentare möglich —
# jede Zeile wird als Repo-Name interpretiert.

group:
  # ──────────────────────────────────────────────────────────────────────
  # Gruppe 1: Pimcore-PROJEKT-Repos
  # ──────────────────────────────────────────────────────────────────────
  - repos: |
      cors-gmbh/bellaflora
      cors-gmbh/rutar
      cors-gmbh/ske-solar
      cors-gmbh/backaldrin
    files:
      - source: templates/pr-guardrail.yml
        dest: .github/workflows/pr-guardrail.yml
      - source: templates/pull_request_template.md
        dest: .github/pull_request_template.md

  # ──────────────────────────────────────────────────────────────────────
  # Gruppe 2: Pimcore-BUNDLE-Repos
  # ──────────────────────────────────────────────────────────────────────
  - repos: |
      cors-gmbh/pimcore-sso
      cors-gmbh/pimcore-search-bundle
      cors-gmbh/pimcore-docker
    files:
      - source: templates/pr-guardrail.yml
        dest: .github/workflows/pr-guardrail.yml
      - source: templates/pull_request_template.md
        dest: .github/pull_request_template.md

  # ──────────────────────────────────────────────────────────────────────
  # Gruppe 3: DEV-/INFRASTRUKTUR-Repos (keine Bundles, gehören aber zum
  # Development dazu)
  # ──────────────────────────────────────────────────────────────────────
  - repos: |
      cors-gmbh/dev-compose
      cors-gmbh/dev
      cors-gmbh/dev-local-infra
    files:
      - source: templates/pr-guardrail.yml
        dest: .github/workflows/pr-guardrail.yml
      - source: templates/pull_request_template.md
        dest: .github/pull_request_template.md

  # ──────────────────────────────────────────────────────────────────────
  # Gruppe 4: Sonstige ANWENDUNGS-Repos (kein Pimcore, eigener Stack)
  # ──────────────────────────────────────────────────────────────────────
  - repos: |
      cors-gmbh/chronos
    files:
      - source: templates/pr-guardrail.yml
        dest: .github/workflows/pr-guardrail.yml
      - source: templates/pull_request_template.md
        dest: .github/pull_request_template.md

  # ──────────────────────────────────────────────────────────────────────
  # Gruppe 5: ÖFFENTLICHE Open-Source-Repos mit externen Contributors.
  # Bekommen den Hinweismodus-Caller (pr-guardrail-oss.yml) statt des
  # Enforce-Templates, damit Fork-PRs nicht automatisch auf Draft landen,
  # und ein englisches PR-Template.
  # ──────────────────────────────────────────────────────────────────────
  - repos: |
      cors-gmbh/pimcore-data-definitions
    files:
      - source: templates/pr-guardrail-oss.yml
        dest: .github/workflows/pr-guardrail.yml
      - source: templates/pull_request_template-oss.md
        dest: .github/pull_request_template.md

  # ──────────────────────────────────────────────────────────────────────
  # Gruppe 6: MANIFEST-Repos (<projekt>-manifest, Kubernetes/ArgoCD).
  # Eigener Caller: die Tickets liegen im gleichnamigen Projekt-Repo ohne
  # den Suffix, deshalb sucht der Guardrail das Issue dort
  # (issue-repo-strip-suffix). Dazu ein PR-Template, das genau das erklärt.
  # ──────────────────────────────────────────────────────────────────────
  - repos: |
      cors-gmbh/backaldrin-manifest
      cors-gmbh/backstage-manifest
      cors-gmbh/bellaflora-manifest
      cors-gmbh/coreshop-website-manifest
      cors-gmbh/coreshop3-demo-manifest
      cors-gmbh/coreshop4-demo-manifest
      cors-gmbh/coreshop4-enterprise-demo-manifest
      cors-gmbh/coreshop5-demo-manifest
      cors-gmbh/ecx-controlling-manifest
      cors-gmbh/faber-manifest
      cors-gmbh/huskies-wels-manifest
      cors-gmbh/kwizda-manifest
      cors-gmbh/oevgd-manifest
      cors-gmbh/rofima-manifest
      cors-gmbh/ronal-bathrooms-manifest
      cors-gmbh/rubig-manifest
      cors-gmbh/rutar-manifest
      cors-gmbh/ske-solar-manifest
      cors-gmbh/slackbot-manifest
      cors-gmbh/sommerhuber-manifest
      cors-gmbh/suzuki-manifest
      cors-gmbh/tilo-manifest
      cors-gmbh/website-2021-manifest
      cors-gmbh/website-2025-manifest
      cors-gmbh/zeroridge-manifest
    files:
      - source: templates/pr-guardrail-manifest.yml
        dest: .github/workflows/pr-guardrail.yml
      - source: templates/pull_request_template-manifest.md
        dest: .github/pull_request_template.md
